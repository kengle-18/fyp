services:
  python-app:
    build: ./python
    container_name: python-app
    command: python hello.py # The command to run the application
  proto-sync:
    image: alpine:latest
    container_name: proto-sync
    volumes:
      - ./test:/test-source:ro                       # Source test files, read-only
      - ./protobuf:/proto-source:ro                  # Source proto files, read-only
      - ./cpp/src/test:/cpp-dest-test                # Destination: cpp test files
      - ./cpp/src/protobuf:/cpp-dest-proto           # Destination: cpp proto files
      - ./scala/src/main/test:/scala-dest-test       # Destination: scala test files
      - ./scala/src/main/protobuf:/scala-dest-proto  # Destination: scala proto files
    command: >
      sh -c "
      mkdir -p /cpp-dest-test /cpp-dest-proto /scala-dest-test /scala-dest-proto;
      
      if [ -d /test-source ] && [ \"\$(ls -A /test-source 2>/dev/null)\" ]; then
        cp -r /test-source/* /cpp-dest-test/;
        cp -r /test-source/* /scala-dest-test/;
      fi
      
      if [ -d /proto-source ] && [ \"\$(ls -A /proto-source 2>/dev/null)\" ]; then
        cp -r /proto-source/* /cpp-dest-proto/;
        cp -r /proto-source/* /scala-dest-proto/;
      fi
      
      echo 'Sync completed successfully';
      "
  scala-app:
    build: ./scala
    container_name: scala-app
    depends_on:
      - python-app
      - proto-sync
    volumes:
      - ./scala/src/main/test:/scala-dest-test:ro
    environment:
      - MAIN_CLASS=com.example.Main

  scala-client:
    build: ./scala
    container_name: scala-client
    environment:
      - MAIN_CLASS=com.example.ScalaClient
      - SERVER_HOST=scala-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/scala-dest-test
      - CONFIG_FILE=config.txt
    depends_on:
      - scala-server
    volumes:
      - ./scala/src/main/test:/scala-dest-test:ro
  scala-server:
    build: ./scala
    container_name: scala-server
    environment:
      - MAIN_CLASS=com.example.ScalaServer
      - SERVER_PORT=50051
    depends_on:
      - python-app
      - proto-sync
    ports:
      - "50051:50051"

# Host port must be different from scala-server to avoid conflicts, e.g., 50052 but the 
# container port remains 50051 as 50051 in container A is independent of 50051 in container B
  cpp-app:
    build:
      context: ./cpp
      target: runtime
    container_name: cpp-app
    command: ["/app/hello_grpc"]
    depends_on:
      - cpp-server
      - proto-sync
    volumes:
      - ./cpp/src/test:/cpp-dest-test:ro

  cpp-client:
    build:
      context: ./cpp
      target: runtime
    container_name: cpp-client
    environment:
      - SERVER_HOST=cpp-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/cpp-dest-test
      - CONFIG_FILE=config.txt
    command: ["/app/client"]  # Override default CMD to run client
    depends_on:
      - cpp-server
      - proto-sync
    volumes:
      - ./cpp/src/test:/cpp-dest-test:ro
      - ./cpp/src/generated:/app/src/generated
      - ./analyzer:/app/cpp/src
    
  cpp-server:
    build:
      context: ./cpp
      target: runtime
    container_name: cpp-server
    environment:
      - SERVER_PORT=50051
    command: ["/app/server"]  # Explicitly run server (matches default CMD)
    depends_on:
      - proto-sync
      - python-app
    ports:
      - "50052:50051"  # Map to different host port to avoid conflict with Scala
    volumes:
      - ./cpp/src/test:/cpp-dest-test:ro
      - ./analyzer:/app/cpp/src

  cpp-generate:
    build: 
      context: ./cpp
      target: builder  # Use builder stage to access generated files
    container_name: cpp-generate
    depends_on:
      - proto-sync
    volumes:
      - ./cpp/src/generated:/tmp/generated:rw
    command: |
      sh -c "
        mkdir -p /tmp/generated
        cp -r /app/src/generated/* /tmp/generated/
      "
  scala-generate:
    build:
      context: ./scala
      target: builder
    container_name: scala-generate
    depends_on:
      - proto-sync
    volumes:
      - ./scala/src/main/protobuf:/app/src/main/protobuf:ro
      - ./scala/src/main/generated:/app/target/scala-2.13/src_managed/main:rw
    command: >
      sh -c '
        sbt clean compile ;
        echo "✅ ALL Generated Scala files:" ;
        find /app/target/scala-2.13/src_managed/main -name "*.scala" -type f -exec basename {} \; | sort ;
        echo "" ;
      '

  cpp-server-scala-client:
    build: ./scala
    container_name: cpp-server-scala-client
    environment:
      - MAIN_CLASS=com.example.ScalaClient
      - SERVER_HOST=scala-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/scala-dest-test
      - CONFIG_FILE=config.txt
    depends_on:
      - cpp-server
    volumes:
      - ./scala/src/main/test:/scala-dest-test:ro

  scala-server-cpp-client:
    build:
      context: ./cpp
      target: runtime
    container_name: scala-server-cpp-client
    environment:
      - SERVER_HOST=cpp-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/cpp-dest-test
      - CONFIG_FILE=config.txt
    command: ["/app/client"]  # Override default CMD to run client
    depends_on:
      - cpp-server
      - proto-sync
    volumes:
      - ./cpp/src/test:/cpp-dest-test:ro
      - ./cpp/src/generated:/app/src/generated
  
  
    
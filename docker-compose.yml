services:
  python-app:
    build: ./python
    container_name: python-app
    command: python hello.py # The command to run the application
  proto-sync:
    image: alpine:latest
    container_name: proto-sync
    volumes:
      - ./scala/src/main/protobuf:/scala-proto:ro    # Scala proto files
      - ./cpp/src:/cpp-src                           # Destination in C++ project
    command: >
      sh -c "cp -u /scala-proto/*.proto /cpp-src/"
  scala-app:
    build: ./scala
    container_name: scala-app
    depends_on:
      - python-app
      - proto-sync
    command: java -jar scala-assembly-0.1.0-SNAPSHOT.jar

  cpp-app:
    build: ./cpp
    container_name: cpp-app
    command: ./hello-cpp
    depends_on:
      - proto-sync
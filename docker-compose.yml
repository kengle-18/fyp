services:
  python-app:
    build: ./python
    container_name: python-app
    command: python hello.py # The command to run the application
  proto-sync:
    image: alpine:latest
    container_name: proto-sync
    volumes:
      - ./test:/test-source:ro                       # Source test files, read-only
      - ./protobuf:/proto-source:ro                  # Source proto files, read-only
      - ./cpp/src/test:/cpp-dest-test                # Destination: cpp test files
      - ./cpp/src/protobuf:/cpp-dest-proto           # Destination: cpp proto files
      - ./scala/src/main/test:/scala-dest-test       # Destination: scala test files
      - ./scala/src/main/protobuf:/scala-dest-proto  # Destination: scala proto files
    command: >
      sh -c "
      echo 'Creating any missing directories...';
      mkdir -p /cpp-dest-test /cpp-dest-proto /scala-dest-test /scala-dest-proto;
      
      echo 'DEBUG: Checking source directories...';
      echo 'Contents of /test-source:';
      ls -la /test-source/ 2>/dev/null || echo 'Directory not found';
      echo 'Contents of /proto-source:';
      ls -la /proto-source/ 2>/dev/null || echo 'Directory not found';
      
      echo 'Syncing test files...';
      if [ -d /test-source ] && [ \"\$(ls -A /test-source 2>/dev/null)\" ]; then
        cp -ru /test-source/* /cpp-dest-test/;
        cp -ru /test-source/* /scala-dest-test/;
        echo 'Test files synced successfully';
        echo 'Contents of scala destination:';
        ls -la /scala-dest-test/;
        echo 'Config file contents:';
        cat /scala-dest-test/config.txt 2>/dev/null || echo 'config.txt not found';
      else
        echo 'No test files found to sync';
      fi
      
      echo 'Syncing proto files...';
      if [ -d /proto-source ] && [ \"\$(ls -A /proto-source 2>/dev/null)\" ]; then
        cp -ru /proto-source/* /cpp-dest-proto/;
        cp -ru /proto-source/* /scala-dest-proto/;
        echo 'Proto files synced successfully';
      else
        echo 'No proto files found to sync';
      fi
      
      echo 'Sync completed successfully';
      "
  scala-app:
    build: ./scala
    container_name: scala-app
    depends_on:
      - python-app
      - proto-sync
    volumes:
      - ./scala/src/main/test:/scala-dest-test:ro
    environment:
      - MAIN_CLASS=com.example.Main

  scala-client:
    build: ./scala
    container_name: scala-client
    environment:
      - MAIN_CLASS=com.example.ScalaClient
    depends_on:
      - scala-server
  scala-server:
    build: ./scala
    container_name: scala-server
    environment:
      - MAIN_CLASS=com.example.ScalaServer

  cpp-app:
    build: ./cpp
    container_name: cpp-app
    depends_on:
      - proto-sync
      - cpp-generate

  cpp-generate:
    build: 
      context: ./cpp
      target: builder  # Use builder stage to access generated files
    container_name: cpp-generate
    depends_on:
      - proto-sync
    volumes:
      - ./cpp/src/generated:/tmp/generated:rw
    command: |
      sh -c "
        mkdir -p /tmp/generated
        cp /app/src/generated/*.h /tmp/generated/ 2>/dev/null || echo 'No .h files found'
        cp /app/src/generated/*.pb.* /tmp/generated/ 2>/dev/null || echo 'No .pb files found'
      "
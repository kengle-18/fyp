services:
  python-app:
    build: ./python
    container_name: python-app
    command: checkConfig.py
    volumes:
      # Host directly to the truth source
      - ./test:/app/src/test
      #  This is not needed if proto sync works, mount host same dir to container same directory
      # - ./python/src/test:/app/src/test
    environment:
      - CONFIG_DIR=/app/src/test
      - DEFAULT_CONFIG_FILE=config.txt
    # depends_on:
    #   - proto-sync
    healthcheck:
      test: ["CMD", "python", "/app/src/checkConfig.py"]
      interval: 5s
      retries: 3
      timeout: 1s
  python-decode:
    image: python:3.11-slim
    container_name: python-decodeBase64
    working_dir: /app
    volumes:
      - ./python/src/decodeBase64.py:/app/decodeBase64.py
    entrypoint: ["python", "decodeBase64.py"]
  python-decode-utf8:
    image: python:3.11-slim
    container_name: python-decodeUtf8
    working_dir: /app
    volumes:
      - ./python/src/decodeUtf8.py:/app/decodeUtf8.py
    entrypoint: ["python", "decodeUtf8.py"]
  python-decode-hex:
    image: python:3.11-slim
    container_name: python-decodeHex
    working_dir: /app
    volumes:
      - ./python/src/decodeHex.py:/app/decodeHex.py
    entrypoint: ["python", "decodeHex.py"]
  python-filemanager:
    build: ./python
    container_name: python-filemanager
    command: fileManager.py
    volumes:
      - ./analyzer:/app/src/analyzer
    environment:
      - ANALYZER_DIR=/app/src/analyzer
      - STATUSFILE=done.txt
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys; d=os.getenv('ANALYZER_DIR','/app/src/analyzer'); sys.exit(0 if os.path.isdir(d) else 1)"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  python-remove-analyzer:
    build: ./python
    container_name: python-remove-analyzer
    command: removeAnalyzer.py
    volumes:
      - ./analyzer:/app/src/analyzer
    environment:
      - ANALYZER_DIR=/app/src/analyzer
    
  proto-sync:
    image: alpine:latest
    container_name: proto-sync
    volumes:
      - ./test:/test-source:ro                       # Source test files, read-only
      - ./protobuf:/proto-source:ro                  # Source proto files, read-only
      - ./cpp/src/test:/cpp-dest-test                # Destination: cpp test files
      - ./cpp/src/protobuf:/cpp-dest-proto           # Destination: cpp proto files
      - ./scala/src/main/test:/scala-dest-test       # Destination: scala test files
      - ./scala/src/main/protobuf:/scala-dest-proto  # Destination: scala proto files
      - ./python/src/test:/python-dest-test          # Destination: python test files
    command: >
      sh -c "
      mkdir -p /cpp-dest-test /cpp-dest-proto /scala-dest-test /scala-dest-proto /python-dest-test;
      
      if [ -d /test-source ] && [ \"\$(ls -A /test-source 2>/dev/null)\" ]; then
        cp -r /test-source/* /cpp-dest-test/;
        cp -r /test-source/* /scala-dest-test/;
        cp -r /test-source/* /python-dest-test/;
      fi
      
      if [ -d /proto-source ] && [ \"\$(ls -A /proto-source 2>/dev/null)\" ]; then
        cp -r /proto-source/* /cpp-dest-proto/;
        cp -r /proto-source/* /scala-dest-proto/;
      fi
      
      echo 'Sync completed successfully';
      "
    depends_on:
      python-app:
        condition: service_completed_successfully

  scala-client:
    build: ./scala
    container_name: scala-client
    environment:
      - MAIN_CLASS=com.example.ScalaClient
      - SERVER_HOST=scala-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/scala-dest-test
      - CONFIG_FILE=config.txt
      - CONFIG_APP_TEXT_DIR=/app/scala/src/generated
      # - CONFIG_APP_TEXT_FILE=scalaClient.txt
      - OUTPUT_FILE_SCALA_MESSAGE_INITAL=scalaMessageInital.txt
      - OUTPUT_FILE_SCALA_MESSAGE_INDIVIDUAL_FIELD=scalaMessageIndiviualField.txt
      - OUTPUT_FILE_SCALA_RESPONSE_FROM_SERVER=scalaResponseFromServer.txt
    depends_on:
      scala-server:
        condition: service_healthy
    volumes:
      # Config 
      - ./scala/src/main/test:/scala-dest-test:ro
      # All output file
      - ./analyzer:/app/scala/src/generated
    restart: on-failure
  scala-server:
    build: ./scala
    container_name: scala-server
    environment:
      - MAIN_CLASS=com.example.ScalaServer
      - SERVER_PORT=50051
      - CONFIG_APP_TEXT_DIR=/app/scala/src/generated
      - OUTPUT_FILE_SCALA_REQUEST_FROM_SERVER=scalaRequestFromServer.txt
      - OUTPUT_FILE_SCALA_HEADER_AT_SERVER=scalaGrpcHeader.txt
    depends_on:
      # python-app:
      #   condition: service_completed_successfully
      proto-sync:
        condition: service_started
      python-filemanager:
        condition: service_healthy
    ports:
      - "50051:50051"
    volumes:
      - ./analyzer:/app/scala/src/generated
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped  # Keep server running
  
  scala-tcpdump:
    image: nicolaka/netshoot
    container_name: scala-tcpdump
    network_mode: "service:scala-server"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./analyzer/scala_traffic_server:/captures
    # $$ escapes to $ in shell container 
    command: >
      sh -c '
        mkdir -p /captures;
        FILENAME=/captures/grpc_scalaserver_$$(date +%Y%m%d_%H%M%S).pcap
        echo "Creating file: $${FILENAME}";
        ls -la /captures;
        tcpdump -i any port 50051 -w $${FILENAME}
      '


# Host port must be different from scala-server to avoid conflicts, e.g., 50052 but the 
# container port remains 50051 as 50051 in container A is independent of 50051 in container B
  cpp-client:
    build:
      context: ./cpp
      target: runtime
    container_name: cpp-client
    environment:
      - SERVER_HOST=cpp-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/cpp-dest-test
      - CONFIG_FILE=config.txt
      - OUTPUT_DIR_GENERATED=/app/cpp/src
      - OUTPUT_FILE_CPP_MESSAGE_INITAL=cppMessageInital.txt
      - OUTPUT_FILE_CPP_MESSAGE_INDIVIDUAL_FIELD=cppMessageIndiviualField.txt
      - OUTPUT_FILE_CPP_RESPONSE_FROM_SERVER=cppResponseFromServer.txt
    command: ["/app/client"]  # Override default CMD to run client
    depends_on:
      cpp-server:
        condition: service_healthy
    volumes:
      - ./cpp/src/test:/cpp-dest-test:ro
      # - ./cpp/src/generated:/app/src/generated
      - ./analyzer:/app/cpp/src
    restart: on-failure  # Restart client if it fails
    
  cpp-server:
    build:
      context: ./cpp
      target: runtime
    container_name: cpp-server
    environment:
      - SERVER_PORT=50051
      - OUTPUT_DIR_GENERATED=/app/cpp/src
      - OUTPUT_FILE_CPP_REQUEST_FROM_SERVER=cppRequestFromServer.txt
      - OUTPUT_FILE_CPPHEADER_AT_SERVER=cppGrpcHeader.txt
    command: ["/app/server"]  # Explicitly run server (matches default CMD)
    depends_on:
      # python-app:
      #   condition: service_completed_successfully
      proto-sync:
        condition: service_started
      python-filemanager:
        condition: service_healthy
    ports:
      - "50052:50051"  # Map to different host port to avoid conflict with Scala
    volumes:
      - ./cpp/src/test:/cpp-dest-test:ro
      - ./analyzer:/app/cpp/src
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped  # Keep server running

  cpp-tcpdump:
    image: nicolaka/netshoot
    container_name: cpp-tcpdump
    network_mode: "service:cpp-server"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./analyzer/cpp_traffic_server:/captures
    # $$ escapes to $ in shell container 
    command: >
      sh -c '
        mkdir -p /captures;
        FILENAME=/captures/grpc_cppserver_$$(date +%Y%m%d_%H%M%S).pcap
        echo "Creating file: $${FILENAME}";
        ls -la /captures;
        tcpdump -i any port 50051 -w $${FILENAME}
      '

  cpp-generate:
    build: 
      context: ./cpp
      target: generate
    container_name: cpp-generate
    depends_on:
      - proto-sync
    volumes:
      - ./cpp/src/generated:/tmp/generated:rw
    command: sh -c "cp -r /app/src/generated/* /tmp/generated/ && echo '✅ Files copied'"

  cpp-generate-full:
    build: 
      context: ./cpp
      target: full-generate  # Use builder stage to access generated files
    container_name: cpp-generate-full
    depends_on:
      - proto-sync
    volumes:
      - ./cpp/src/generated:/tmp/generated:rw
    command: sh -c "cp -r /app/src/generated/* /tmp/generated/ && echo '✅ Files copied'"

  scala-generate:
    build:
      context: ./scala
      target: generator
    container_name: scala-generate
    depends_on:
      - proto-sync
    volumes:
      - ./scala/src/main/protobuf:/app/src/main/protobuf:ro
      - ./scala/src/main/generated:/app/target/scala-2.13/src_managed/main:rw
    command: >
      sh -c '
        sbt clean compile ;
        echo "✅ ALL Generated Scala files:" ;
        find /app/target/scala-2.13/src_managed/main -name "*.scala" -type f -exec basename {} \; | sort ;
        echo "" ;
        /bin/sh
      '
    
  # Generate new protobuf api 
  cpp-scala-generate:
    image: "alpine:latest"
    container_name: cpp-scala-generate
    depends_on:
      - cpp-generate
      - scala-generate
    command: sh -c 'echo "✅ C++ and Scala generation completed with full apis"'

  cpp-scala-generate-full:
    image: "alpine:latest"
    container_name: cpp-scala-generate-full
    depends_on:
      - cpp-generate-full
      - scala-generate
    command: sh -c 'echo "✅ C++ and Scala generation completed"'

# cpp server and scala-client, this is scala-client that deps on cpp-server
  cpp-server-scala-client:
    build: ./scala
    container_name: cpp-server-scala-client
    environment:
      - MAIN_CLASS=com.example.ScalaClient
      - SERVER_HOST=cpp-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/scala-dest-test
      - CONFIG_FILE=config.txt
      - CONFIG_APP_TEXT_DIR=/app/scala/src/generated
      - OUTPUT_FILE_SCALA_MESSAGE_INITAL=scalaMessageInital.txt
      - OUTPUT_FILE_SCALA_MESSAGE_INDIVIDUAL_FIELD=scalaMessageIndiviualField.txt
      - OUTPUT_FILE_SCALA_RESPONSE_FROM_SERVER=scalaResponseFromServer.txt
    depends_on:
      cpp-server:
        condition: service_healthy
    volumes:
      - ./scala/src/main/test:/scala-dest-test:ro
      - ./analyzer:/app/scala/src/generated
    restart: on-failure

  # scala server and cpp-client, this is cpp-client that deps on scala-server
  scala-server-cpp-client:
    build:
      context: ./cpp
      target: runtime
    container_name: scala-server-cpp-client
    environment:
      - SERVER_HOST=scala-server
      - SERVER_PORT=50051
      - CONFIG_DIR=/cpp-dest-test
      - CONFIG_FILE=config.txt
      - OUTPUT_DIR_GENERATED=/app/cpp/src
      - OUTPUT_FILE_CPP_MESSAGE_INITAL=cppMessageInital.txt
      - OUTPUT_FILE_CPP_MESSAGE_INDIVIDUAL_FIELD=cppMessageIndiviualField.txt
      - OUTPUT_FILE_CPP_RESPONSE_FROM_SERVER=cppResponseFromServer.txt
    command: ["/app/client"]  # Override default CMD to run client
    depends_on:
      scala-server:
        condition: service_healthy
    volumes:
      - ./cpp/src/test:/cpp-dest-test:ro
      - ./cpp/src/generated:/app/src/generated
      - ./analyzer:/app/cpp/src
    restart: on-failure  # Restart client if it fails
  
  
    